[workspace]
resolver = "2"
members = ["crates/explorer-core", "crates/explorer-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/linux-explorer"
rust-version = "1.95"

[workspace.dependencies]
explorer-core = { path = "crates/explorer-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
tempfile = "3"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rs = "0.3"
ruzstd = "0.9"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "util", "bzip2", "ppmd"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
x11rb = "0.14"
gix = { version = "0.90", default-features = false, features = ["status", "sha1"] }
ttf-parser = "0.25"
hayro = "0.9"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
vt100 = "0.18"
md5 = "0.8"
egui_kittest = { version = "0.37", features = ["eframe"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
