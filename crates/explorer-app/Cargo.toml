[package]
name = "linux-explorer"
description = "A Windows Explorer style file manager for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "linux-explorer"
path = "src/main.rs"

[dependencies]
explorer-core.workspace = true
eframe.workspace = true
image.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
arboard.workspace = true
vt100.workspace = true
md5.workspace = true
resvg.workspace = true
ttf-parser.workspace = true
hayro.workspace = true
zbus.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
egui_kittest.workspace = true

[package.metadata.deb]
maintainer = "Linux Explorer contributors"
section = "utils"
assets = [
  ["target/release/linux-explorer", "usr/bin/", "755"],
  ["../../packaging/linux-explorer.desktop", "usr/share/applications/", "644"],
  ["../../packaging/linux-explorer.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/linux-explorer", dest = "/usr/bin/linux-explorer", mode = "755" },
  { source = "../../packaging/linux-explorer.desktop", dest = "/usr/share/applications/linux-explorer.desktop", mode = "644" },
  { source = "../../packaging/linux-explorer.svg", dest = "/usr/share/icons/hicolor/scalable/apps/linux-explorer.svg", mode = "644" },
]
